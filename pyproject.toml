[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pytranspiler"
version = "0.1.0"
description = "A modular, rule-driven transpiler that lowers a subset of Python into Rust, Ruby, C, and x86_64 assembly."
readme = {text = "", content-type = "text/plain"}
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Rzy"},
]
dependencies = []

[project.scripts]
pytranspiler = "pytranspiler.pytranspiler:main"

[tool.setuptools.package-data]
pytranspiler = [
    "rules/**/*.json",
    "schemas/*.json",
]
