[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pytranspiler"
version = "0.1.0"
description = "A modular, rule-driven transpiler that lowers a subset of Python into Rust, Ruby, C, and x86_64 assembly."
readme = {text = "", content-type = "text/plain"}
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Rzy"},
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "types-setuptools>=68.0",
]

[project.scripts]
pytranspiler = "pytranspiler.pytranspiler:main"

[tool.setuptools.package-data]
pytranspiler = [
    "rules/**/*.json",
    "schemas/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "B011", "B009"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["pytranspiler/tests"]
python_files = ["run_tests.py"]
